version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: obe_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - obe_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obe_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules # Anonymous volume to prevent local node_modules from overriding container node_modules
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/obe-platform
    depends_on:
      - mongodb
    networks:
      - obe_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: obe_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume
    environment:
      # Optional: Depending on how Vite connects to backend
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - obe_network
    restart: unless-stopped

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: obe_ml
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - obe_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  obe_network:
    driver: bridge
